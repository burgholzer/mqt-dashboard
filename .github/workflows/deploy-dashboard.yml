name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # 05:00 CET (06:00 CEST) -- GitHub Actions schedules use UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - name: Collect dashboard data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
        run: uv run mqt-dashboard-collection
      - name: Build static site
        run: uv run mqt-dashboard-build --output site
      - name: Publish GitHub Pages site
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: pr-preview
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
