name: Deploy pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Forks do not receive repository secrets or a write-capable GITHUB_TOKEN.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: github.event.action != 'closed'
      - run: uv sync --locked
        if: github.event.action != 'closed'
      - name: Collect dashboard data
        if: github.event.action != 'closed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
        run: uv run mqt-dashboard-collection
      - name: Build static site
        if: github.event.action != 'closed'
        run: uv run mqt-dashboard-build --output site
      - name: Publish or remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          wait-for-pages-deployment: true
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
